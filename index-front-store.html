<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Front Store</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .logo-link {
      position: relative;
      z-index: 2;
      display: inline-block;
      transition: transform 0.25s ease;
      cursor: pointer;
    }

    .logo-link:hover {
      transform: scale(1.08);
    }

    .logo-link img {
      display: block;
      width: min(280px, 60vw);
      height: auto;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5));
    }

  </style>
</head>
<body>
  <video id="bgVideo" autoplay muted loop playsinline preload="auto">
    <source src="assets/Backgrounds/fondo.mp4" type="video/mp4" />
  </video>
  <div class="overlay"></div>

  <!-- Música de fondo (continúa entre páginas) -->
  <audio id="bgAudio" src="assets/song/song1.mp3" loop preload="auto"></audio>

  <a class="logo-link" href="index-store.html" aria-label="Entrar a la tienda">
    <img src="assets/logos/logo.png" alt="Logo" />
  </a>

  <script>
    (function () {
      var audio = document.getElementById('bgAudio');
      var video = document.getElementById('bgVideo');

      // Refuerza que el video de fondo realmente se reproduzca (muted, así que
      // no debería estar bloqueado por el navegador, pero forzamos el play()
      // por si el atributo autoplay no alcanzó a dispararse a tiempo).
      function attemptPlayVideo() {
        var pv = video.play();
        if (pv && typeof pv.catch === 'function') {
          pv.catch(function () {
            var resumeVideo = function () {
              video.play().catch(function () {});
              document.removeEventListener('click', resumeVideo);
              document.removeEventListener('touchstart', resumeVideo);
            };
            document.addEventListener('click', resumeVideo, { once: true });
            document.addEventListener('touchstart', resumeVideo, { once: true });
          });
        }
      }
      attemptPlayVideo();
      video.addEventListener('canplay', attemptPlayVideo, { once: true });

      function restoreTime() {
        var t = sessionStorage.getItem('songTime');
        var ts = sessionStorage.getItem('songTimestamp');
        if (t !== null && ts !== null) {
          var elapsed = (Date.now() - Number(ts)) / 1000;
          var newTime = Number(t) + elapsed;
          if (audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
            newTime = newTime % audio.duration;
          }
          try { audio.currentTime = newTime; } catch (e) {}
        }
      }

      function saveTime() {
        try {
          sessionStorage.setItem('songTime', audio.currentTime);
          sessionStorage.setItem('songTimestamp', Date.now());
        } catch (e) {}
      }

      audio.addEventListener('loadedmetadata', restoreTime);

      // Intenta reproducir la música automáticamente. Si el navegador la
      // bloquea (política de autoplay), se reintenta de forma silenciosa en
      // el primer toque/clic que la persona haga en la página, sin mostrar
      // ningún botón ni pedir nada explícitamente.
      function attemptPlayAudio() {
        var p = audio.play();
        if (p && typeof p.catch === 'function') {
          p.catch(function () {
            var resume = function () {
              audio.play().catch(function () {});
              document.removeEventListener('click', resume);
              document.removeEventListener('touchstart', resume);
              document.removeEventListener('keydown', resume);
            };
            document.addEventListener('click', resume, { once: true });
            document.addEventListener('touchstart', resume, { once: true });
            document.addEventListener('keydown', resume, { once: true });
          });
        }
      }
      attemptPlayAudio();

      window.addEventListener('pagehide', saveTime);
      window.addEventListener('beforeunload', saveTime);
      setInterval(saveTime, 1000);
    })();
  </script>
</body>
</html>
