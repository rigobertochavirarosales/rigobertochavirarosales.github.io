<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Front Store</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .logo-link {
      position: relative;
      z-index: 2;
      display: inline-block;
      transition: transform 0.25s ease;
      cursor: pointer;
    }

    .logo-link:hover {
      transform: scale(1.08);
    }

    .logo-link img {
      display: block;
      width: min(280px, 60vw);
      height: auto;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5));
    }

    .sound-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 3;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    .sound-btn.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <video autoplay muted loop playsinline>
    <source src="assets/Backgrounds/fondo.mp4" type="video/mp4" />
  </video>
  <div class="overlay"></div>

  <!-- Música de fondo (continúa entre páginas) -->
  <audio id="bgAudio" src="assets/song/song1.mp4" loop preload="auto"></audio>
  <button id="soundBtn" class="sound-btn hidden" type="button">🔊 Activar sonido</button>

  <a class="logo-link" href="index-store.html" aria-label="Entrar a la tienda">
    <img src="assets/logos/logo.png" alt="Logo" />
  </a>

  <script>
    (function () {
      var audio = document.getElementById('bgAudio');
      var soundBtn = document.getElementById('soundBtn');

      function restoreTime() {
        var t = sessionStorage.getItem('songTime');
        var ts = sessionStorage.getItem('songTimestamp');
        if (t !== null && ts !== null) {
          var elapsed = (Date.now() - Number(ts)) / 1000;
          var newTime = Number(t) + elapsed;
          if (audio.duration && !isNaN(audio.duration) && audio.duration > 0) {
            newTime = newTime % audio.duration;
          }
          try { audio.currentTime = newTime; } catch (e) {}
        }
      }

      function saveTime() {
        try {
          sessionStorage.setItem('songTime', audio.currentTime);
          sessionStorage.setItem('songTimestamp', Date.now());
        } catch (e) {}
      }

      audio.addEventListener('loadedmetadata', restoreTime);

      function attemptPlay() {
        var p = audio.play();
        if (p && typeof p.catch === 'function') {
          p.catch(function () {
            soundBtn.classList.remove('hidden');
          });
        }
      }
      attemptPlay();

      soundBtn.addEventListener('click', function () {
        audio.play();
        soundBtn.classList.add('hidden');
      });

      window.addEventListener('pagehide', saveTime);
      window.addEventListener('beforeunload', saveTime);
      setInterval(saveTime, 1000);
    })();
  </script>
</body>
</html>
