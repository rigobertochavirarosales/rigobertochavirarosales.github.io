<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Front Store</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }

    .logo-link {
      position: relative;
      z-index: 2;
      display: inline-block;
      transition: transform 0.25s ease;
      cursor: pointer;
    }

    .logo-link:hover {
      transform: scale(1.08);
    }

    .logo-link img {
      display: block;
      width: min(280px, 60vw);
      height: auto;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5));
    }
  </style>
</head>
<body>
  <video autoplay muted loop playsinline>
    <source src="assets/Backgrounds/fondo.mp4" type="video/mp4" />
  </video>
  <div class="overlay"></div>

  <a class="logo-link" href="index-store.html" aria-label="Entrar a index-store">
    <img src="assets/logos/logo.png" alt="Logo" />
  </a>
</body>
</html>
